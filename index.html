
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffcc00">
 
 <title>Jovem Pan SP 100,9 FM</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;display:grid;place-items:center;
background:linear-gradient(145deg,#101827,#293b55);
font-family:Arial,sans-serif;color:white;padding:20px
}
.radio{
width:100%;max-width:390px;text-align:center;
background:#172235;border-radius:28px;padding:30px 22px;
box-shadow:0 15px 50px #0008
}
.logo{
width:120px;height:120px;margin:25px auto;
border-radius:28px;background:#ffcc00;color:#111827;
display:grid;place-items:center;font-size:52px;font-weight:900
}
h1{font-size:25px}
.freq{color:#ffcc00;font-size:20px;font-weight:bold}
button{
border:0;border-radius:50%;width:85px;height:85px;
background:#ffcc00;color:#111827;font-size:32px;
margin:25px;cursor:pointer
}
input{width:100%;accent-color:#ffcc00}
.status{color:#b9c5d6;font-size:14px}
a{color:#ffcc00;text-decoration:none}
</style>
</head>
<body>
<div class="radio">
<div style="color:#ffcc00;letter-spacing:5px;font-weight:bold">
JOVEM PAN
</div>
<div class="logo">JP</div>
<h1>Jovem Pan São Paulo</h1>
<div class="freq">100,9 FM</div>
<p class="status" id="status">Pronto para sintonizar</p>

<button id="play">▶</button>

<p>VOLUME</p>
<input id="volume" type="range" min="0" max="1"
step="0.01" value="0.8">

<p style="margin-top:25px">
<a href="https://jovempan.com.br/" target="_blank">
Site oficial da Jovem Pan
</a>
</p>

<audio id="audio" preload="none"
src="https://stream.zeno.fm/c45wbq2us3buv">
</audio>
</div>

<script>
const audio=document.getElementById('audio');
const play=document.getElementById('play');
const status=document.getElementById('status');
const volume=document.getElementById('volume');

audio.volume=0.8;

play.onclick=async()=>{
 if(audio.paused){
  status.textContent='Conectando...';
  try{
   await audio.play();
   play.textContent='Ⅱ';
   status.textContent='Reproduzindo ao vivo';
  }catch(e){
   status.textContent='Não foi possível conectar à rádio';
  }
 }else{
  audio.pause();
  play.textContent='▶';
  status.textContent='Pausado';
 }
};

audio.onended=()=>{
 play.textContent='▶';
 status.textContent='Transmissão encerrada';
};

audio.onerror=()=>{
 status.textContent='Sinal indisponível. Tente novamente.';
};

volume.oninput=()=>{
 audio.volume=Number(volume.value);
};
</script>
 <script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
 </script>
</body>
</html>
